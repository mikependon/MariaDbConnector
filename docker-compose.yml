name: mariadb
version: '3.8'

services:

  mariadb:
    container_name: mariadb
    image: mariadb:latest
    ports:
      - 127.0.0.1:3307:3306
    networks:
      - mariadb
    environment:
      MARIADB_ROOT_PASSWORD: MariaDB2026
    command: --local-infile=1

networks:
  mariadb:
    driver: bridge