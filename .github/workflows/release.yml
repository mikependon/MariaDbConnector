name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.0.0)"
        required: true
        type: string
  release:
    types: [published]

env:
  PROJECT_PATH: src/MariaDbConnector/MariaDbConnector/MariaDbConnector.csproj

jobs:
  publish:
    name: Publish MariaDbConnector
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve Version
        id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" | sed 's/=v/=/' >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore $PROJECT_PATH

      - name: Build
        run: dotnet build $PROJECT_PATH -c Release --no-restore

      - name: Pack
        run: dotnet pack $PROJECT_PATH -c Release --no-build -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: Login to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: mikependon

      - name: Publish
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
